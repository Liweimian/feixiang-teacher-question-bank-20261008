<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>飞象老师本地端｜demo演示</title>
    <link rel="stylesheet" href="./styles.css?v=20260914knowledge2" />
    <link rel="stylesheet" href="./practice-demo.css?v=20260908flow26" />
    <link rel="stylesheet" href="./ui-fixes.css?v=20260910skills2" />
    <link rel="stylesheet" href="./question-workbench-v3.css?v=20261010wb83" />
    <link rel="stylesheet" href="./requirements-panel.css?v=20261010prd19" />
  </head>
  <body>
    <div class="demo-badge">demo演示</div>
    <div class="app-shell" id="appShell">
      <aside class="sidebar">
        <header class="brand-row">
          <img src="./assets/logo.svg" alt="飞象老师" />
          <button class="icon-button" aria-label="收起侧边栏" data-tooltip="收起侧边栏">◧</button>
        </header>

        <button class="new-task" id="newTaskButton"><span>⊕</span> 新任务</button>
        <a class="knowledge-entry community-entry" href="https://djxky.github.io/fx-community/" target="_blank" rel="noopener noreferrer"><span aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="8" r="2.5"/><path d="M3.5 19v-1.5A5.5 5.5 0 0 1 9 12h0a5.5 5.5 0 0 1 5.5 5.5V19M14 13.2a4.5 4.5 0 0 1 6.5 4V19"/></svg></span>资源社区</a>
        <button class="knowledge-entry product-entry" id="teachingSkillsEntry"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 1.35 4.15L17.5 8.5l-4.15 1.35L12 14l-1.35-4.15L6.5 8.5l4.15-1.35L12 3Z"/><path d="m18.5 14 .72 2.28 2.28.72-2.28.72L18.5 20l-.72-2.28L15.5 17l2.28-.72L18.5 14Z"/><path d="M5.5 14.5v5M3 17h5"/></svg></span>教学技能</button>
        <a class="knowledge-entry product-entry" href="./workbench.html"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4z"/><path d="M16.5 14v5M14 16.5h5"/></svg></span>飞象题库</a>
        <div class="knowledge-entry static-entry" aria-label="飞象学院"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 9 9-4.5L21 9l-9 4.5L3 9Z"/><path d="M6.5 11v4.2c2.8 2.5 8.2 2.5 11 0V11M21 9v6"/></svg></span>飞象学院</div>
        <button class="knowledge-entry product-entry" id="knowledgeEntry"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 4.5h12.5A1.5 1.5 0 0 1 19 6v13.5H6.5A1.5 1.5 0 0 1 5 18V4.5Z"/><path d="M5 18c0-.8.7-1.5 1.5-1.5H19"/></svg></span>我的知识库</button>

        <section class="workspace-section">
          <div class="section-title">
            <span>本地工作区</span>
            <span class="section-actions"><button aria-label="搜索">⌕</button><button aria-label="视图选项">☷</button><button aria-label="添加工作区">▱</button></span>
          </div>
          <div class="workspace-name"><span class="folder-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 6.5h6l1.7 2h9.3v9.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2V6.5Z"/><path d="M3.5 9h17"/></svg></span> demo-workspace</div>
          <nav class="task-list" aria-label="工作区任务">
            <button class="task-item active" data-task="blank"><span>新任务</span></button>
            <button class="task-item" data-task="courseware-demo"><span>生成小学5年级 长方体…</span><small>今日</small></button>
            <button class="task-item" data-task="meeting"><span>生成期中家长会材料</span><small>刚刚</small></button>
            <button class="task-item" data-task="intro"><span>飞象老师功能简介</span><small>1小时</small></button>
            <button class="task-item" data-task="geography"><span>分析地理和互动课件内容</span><small>1小时</small></button>
          </nav>
        </section>

        <footer class="sidebar-footer">
          <div class="account-row">
            <button class="account-trigger" id="accountTrigger">
              <span class="avatar">J</span><span><b>Joyce22</b><small>剩余积分：909</small></span>
            </button>
            <button class="phone-button" aria-label="连接手机" data-tooltip="连接手机"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M10 5h4M11 18.5h2"/></svg></button>
          </div>
        </footer>
      </aside>

      <main class="main-stage">
        <section class="conversation" id="conversationView">
          <header class="task-header" id="taskHeader">
            <div><h1>生成期中家长会材料</h1><span>demo演示 · 模拟数据 · 不调用 API</span></div>
            <button id="replayButton">重新播放</button>
          </header>
          <div class="message-scroll" id="messageScroll">
            <div class="message-column" id="messageColumn"></div>
          </div>
          <div class="composer-wrap">
            <div class="workspace-selector">▱ <b>demo-workspace</b>⌄</div>
            <div class="composer-card">
              <div class="composer-attachments-row composer-attachments-row--top" id="composerAttachmentsRowTop" hidden></div>
              <div class="composer-inline-row">
                <div class="composer-skill-slot" id="skillRow"></div>
                <textarea id="composerInput" placeholder="描述你要完成的教学任务"></textarea>
              </div>
              <div class="composer-meta-row" id="attachmentRow"></div>
              <div class="composer-actions">
                <button class="add-button" id="addButton" aria-label="添加">＋</button>
                <div class="composer-attachments-row composer-attachments-row--actions" id="composerAttachmentsRowActions" hidden></div>
                <div class="composer-quick-actions" aria-label="快捷教学能力">
                  <button type="button" data-composer-skill="教学动画"><span>◌</span>教学动画</button>
                  <button type="button" data-composer-skill="教育应用"><span>▦</span>教育应用<em>NEW</em></button>
                  <button type="button" data-composer-skill="教学游戏"><span>♙</span>教学游戏</button>
                  <button type="button" data-composer-skill="互动课件"><span>◉</span>互动课件</button>
                  <button type="button" data-composer-skill="数据回收"><span>▥</span>数据回收</button>
                  <button type="button" data-composer-skill="组题"><span>▤</span>AI组题</button>
                  <button type="button" data-composer-skill="教学设计"><span>▱</span>AI教案·大单元</button>
                </div>
                <button class="mode-button" id="modeButton">◉ 均衡模式⌄</button>
                <button class="voice-button" type="button" aria-label="语音输入">♩</button>
                <button class="send-button" id="sendButton" aria-label="发送" disabled>↑</button>
              </div>
            </div>
          </div>
        </section>

        <aside class="preview-pane" id="previewPane" aria-label="文件预览">
          <div class="preview-tabs" id="previewTabs"></div>
          <div class="preview-toolbar">
            <div class="preview-toolbar-actions">
              <button id="annotateButton" type="button" aria-pressed="false" aria-label="注释" title="注释">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="m13.5 6.5 3 3"/></svg>
              </button>
              <button id="zoomButton" type="button" aria-label="缩放" title="100%">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle fill="none" stroke="currentColor" stroke-width="1.8" cx="11" cy="11" r="7"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg>
                <span class="preview-zoom-label">100%</span>
              </button>
              <a id="downloadButton" download aria-label="下载" title="下载">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 4v11m-4-4 4 4 4-4M5 19h14"/></svg>
              </a>
              <a class="open-button" id="openButton" target="_blank" aria-label="在新窗口打开" title="打开">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M14 5h5v5M10 14 19 5M19 14v5H5V5h5"/></svg>
              </a>
              <button class="close-preview" id="closePreview" type="button" aria-label="关闭预览" title="关闭">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M18 6 6 18M6 6l12 12"/></svg>
              </button>
            </div>
          </div>
          <div class="preview-body" id="previewBody"></div>
        </aside>
      </main>
      <section class="knowledge-panel" id="knowledgePanel" hidden></section>
    </div>

    <div class="popover add-menu" id="addMenu" hidden></div>
    <div class="popover mode-menu" id="modeMenu" hidden></div>
    <div class="popover account-menu" id="accountMenu" hidden>
      <div class="account-head"><span class="avatar">J</span><b>Joyce22</b></div>
      <div class="credit-line"><span>剩余积分</span><b>909</b></div>
      <button>⌁ <span>邀请好友</span></button>
      <button>⚙ <span>设置</span><kbd>⌘,</kbd></button>
      <button>↪ <span>退出登录</span></button>
    </div>

    <section class="question-picker" id="questionPicker" role="dialog" aria-modal="true" aria-labelledby="questionPickerTitle" hidden>
      <div class="question-picker-card">
        <header class="question-picker-header">
          <div><h2 id="questionPickerTitle">从题库添加</h2><p>按教材章节或知识点选题，加入当前对话</p></div>
          <div class="question-picker-actions">
            <span id="questionPickerCount">已选0道题</span>
            <button type="button" class="question-picker-cancel" id="questionPickerCancel">取消</button>
            <button type="button" class="question-picker-confirm" id="questionPickerConfirm">加入对话</button>
          </div>
        </header>
        <iframe id="questionPickerFrame" title="从题库选择题目"></iframe>
      </div>
    </section>

    <script src="./practice-demo.js?v=20260908flow37"></script>
    <script src="./question-workbench-v3.js?v=20261010wb83"></script>
    <script src="./app.js?v=20260914knowledge2"></script>
    <script src="./requirements-panel.js?v=20261010prd53"></script>
  </body>
</html>
