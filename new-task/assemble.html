<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>飞象组题 · 工作台</title>
  <style>
    :root {
      --ink: #16342c;
      --strong: #10261f;
      --muted: #6a7a73;
      --line: #d5e0db;
      --green: #0b7a56;
      --green-dark: #066348;
      --soft: #eef6f2;
      --canvas: #e4eae6;
      --paper: #fffefb;
      --danger: #b42318;
      --warn: #b54708;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background: #f3f6f4;
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

    .app { height: 100%; display: flex; flex-direction: column; min-width: 1100px; }

    .topbar {
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      flex: none;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 750; letter-spacing: .02em; }
    .logo {
      width: 28px; height: 28px; border-radius: 8px;
      display: grid; place-items: center;
      background: var(--green); color: #fff;
    }
    .logo svg { width: 16px; height: 16px; }
    .title-edit {
      min-width: 180px; max-width: 320px;
      height: 34px; padding: 0 10px;
      border: 0; border-bottom: 1px solid transparent; outline: 0;
      background: transparent; color: var(--strong); font-weight: 650;
    }
    .title-edit:focus { border-bottom-color: #9ecbb8; }
    .meta { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
    .meta b { color: var(--ink); font-weight: 650; }
    .dot { width: 3px; height: 3px; border-radius: 50%; background: #c3d0ca; }
    .spacer { flex: 1; }
    .ghost, .primary {
      height: 34px; padding: 0 12px; border-radius: 8px; font-size: 13px;
    }
    .ghost { border: 1px solid #d5e3dc; background: #fff; color: #4d6158; }
    .ghost:hover { border-color: #b7cec3; color: var(--green); }
    .primary { border: 1px solid var(--green); background: var(--green); color: #fff; font-weight: 650; }
    .primary:hover { background: var(--green-dark); }

    .workspace {
      flex: 1; min-height: 0;
      display: grid;
      grid-template-columns: minmax(520px, 1fr) minmax(520px, 1.08fr);
    }

    /* ── Left picker ── */
    .picker {
      min-width: 0; min-height: 0;
      display: flex; flex-direction: column;
      background: #f7f9f8;
      border-right: 1px solid #dce6e1;
    }
    .picker-head {
      padding: 14px 16px 10px;
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    }
    .picker-head h1 { margin: 0; font-size: 15px; }
    .picker-head p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .subject-select {
      height: 32px; padding: 0 8px;
      border: 1px solid var(--line); border-radius: 8px; background: #fff;
    }

    .source-tabs {
      margin: 0 16px 12px;
      display: grid;
      grid-template-columns: 1.55fr .85fr .95fr 1.05fr;
      gap: 6px;
      padding: 5px;
      border-radius: 14px;
      background: #ecefec;
    }
    .source-tab {
      min-height: 54px;
      display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
      gap: 1px;
      padding: 7px 10px;
      border: 0; border-radius: 10px;
      background: transparent;
      color: #5d6e66;
      text-align: left;
    }
    .source-tab small { font-size: 10px; color: #8a9891; font-weight: 500; }
    .source-tab b { font-size: 13px; font-weight: 650; }
    .source-tab--hero b { font-size: 14px; }
    .source-tab--hero { padding-left: 12px; }
    .source-tab:hover { color: var(--ink); background: #f7faf8; }
    .source-tab.on { background: #fff; color: var(--ink); box-shadow: 0 1px 0 rgba(16,38,31,.04); }
    .source-tab--hero.on {
      background: var(--green);
      color: #fff;
    }
    .source-tab--hero.on small { color: #d4efe4; }

    .picker-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 12px 12px; }

    .bank {
      flex: 1; min-height: 0;
      display: grid;
      grid-template-columns: 176px minmax(0, 1fr);
      gap: 10px;
    }
    .tree, .results, .panel {
      min-height: 0;
      border: 1px solid #e1eae5;
      border-radius: 14px;
      background: #fff;
    }
    .tree { display: flex; flex-direction: column; overflow: hidden; }
    .tree-title { padding: 12px 12px 8px; font-size: 12px; font-weight: 700; }
    .tree-title span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; font-weight: 400; }
    .tree-list { flex: 1; overflow: auto; padding: 0 8px 10px; }
    .tree-item {
      width: 100%;
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 8px; margin: 2px 0;
      border: 0; border-radius: 8px; background: transparent;
      color: #3f534b; font-size: 12px;
    }
    .tree-item.group { font-weight: 700; color: #2c4038; }
    .tree-item em { color: #93a39c; font-style: normal; font-size: 11px; }
    .tree-item:hover { background: #f3f7f5; }
    .tree-item.on { background: var(--soft); color: var(--green); font-weight: 700; }
    .tree-item.on em { color: var(--green); }

    .results { display: flex; flex-direction: column; overflow: hidden; }
    .results-head {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 10px 12px; border-bottom: 1px solid #eef2f0;
    }
    .results-head b { font-size: 13px; }
    .results-head .count { margin-left: auto; color: var(--muted); font-size: 12px; }
    .filters { display: flex; gap: 6px; }
    .filters select {
      height: 30px; padding: 0 8px;
      border: 1px solid var(--line); border-radius: 7px; background: #f8faf9; font-size: 12px;
    }
    .search {
      height: 32px; display: flex; align-items: center; gap: 6px;
      padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: #f8faf9; color: #8a9690;
      min-width: 160px; flex: 1;
    }
    .search:focus-within { background: #fff; border-color: #9ecbb8; }
    .search input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--ink); }

    .q-list { flex: 1; overflow: auto; padding: 8px; display: grid; gap: 8px; align-content: start; }
    .qcard {
      display: grid; grid-template-columns: 18px 1fr auto;
      gap: 10px; align-items: start;
      padding: 10px 12px;
      border: 1px solid #e6eeea; border-radius: 12px;
      background: #fff; cursor: grab;
    }
    .qcard:hover { border-color: #c3d9ce; }
    .qcard.in-sheet { background: #f4faf7; border-color: #cfe4d9; }
    .qcard.dragging { opacity: .45; }
    .qcard-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
    .tag {
      height: 20px; padding: 0 6px; border-radius: 999px;
      background: #f3f6f4; color: #5d6e66; font-size: 11px; display: inline-flex; align-items: center;
    }
    .tag.added { background: var(--soft); color: var(--green); font-weight: 650; }
    .qcard p { margin: 0; font-size: 13px; line-height: 1.55; color: var(--strong); }
    .qcard small { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .qcard-ops { display: flex; flex-direction: column; gap: 6px; }
    .icon-btn {
      width: 28px; height: 28px; display: grid; place-items: center;
      border: 1px solid #dbe6e1; border-radius: 8px; background: #fff; color: #4d6158;
    }
    .icon-btn:hover { border-color: var(--green); color: var(--green); background: var(--soft); }
    .icon-btn.on { background: var(--green); border-color: var(--green); color: #fff; }

    .select-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; border-top: 1px solid #eef2f0; font-size: 12px; color: var(--muted);
    }

    .panel { flex: 1; min-height: 0; overflow: auto; padding: 16px; }
    .kp-grid { display: grid; gap: 10px; }
    .kp-group { border: 1px solid #e6eeea; border-radius: 12px; padding: 12px; }
    .kp-group h3 { margin: 0 0 8px; font-size: 13px; }
    .kp-row {
      width: 100%; display: grid; grid-template-columns: 1fr auto auto;
      gap: 8px; align-items: center;
      padding: 8px 0; border: 0; border-top: 1px solid #f1f4f2; background: transparent; text-align: left;
    }
    .kp-row:first-of-type { border-top: 0; }
    .kp-row b { font-size: 13px; font-weight: 650; }
    .kp-row span { color: var(--muted); font-size: 12px; }
    .mini { height: 28px; padding: 0 10px; border: 1px solid #d5e3dc; border-radius: 7px; background: #fff; font-size: 12px; }
    .mini.primary { border-color: var(--green); background: var(--soft); color: var(--green); font-weight: 650; }
    .cover { font-size: 11px; color: var(--green); font-weight: 650; }
    .cover.off { color: #9aa7a1; font-weight: 500; }

    .dropzone {
      height: 210px; display: grid; place-items: center; text-align: center;
      border: 1.5px dashed #b7cec3; border-radius: 16px;
      background: linear-gradient(#f8fbf9, #f3f7f5);
      color: var(--green);
    }
    .dropzone b { display: block; font-size: 15px; margin-bottom: 4px; color: var(--strong); }
    .dropzone p { margin: 0; color: var(--muted); font-size: 12px; }
    .upload-list { margin-top: 14px; display: grid; gap: 8px; }
    .file-row {
      display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center;
      padding: 10px 12px; border: 1px solid #e6eeea; border-radius: 12px;
    }
    .file-ico { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: var(--soft); color: var(--green); font-weight: 800; font-size: 11px; }
    .file-row b { display: block; font-size: 13px; }
    .file-row small { color: var(--muted); }
    .parse-card { margin-top: 12px; padding: 12px; border-radius: 12px; background: #f7faf8; border: 1px solid #e1ebe6; }
    .parse-card h3 { margin: 0 0 8px; font-size: 13px; }
    .kb-row {
      width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
      padding: 12px; margin-bottom: 8px;
      border: 1px solid #e6eeea; border-radius: 12px; background: #fff; text-align: left;
    }
    .kb-row:hover { border-color: #c3d9ce; }
    .kb-row b { display: block; }
    .kb-row small { color: var(--muted); }

    /* ── Right canvas ── */
    .canvas {
      min-width: 0; min-height: 0;
      display: flex; flex-direction: column;
      background:
        radial-gradient(circle, #cfd8d3 1px, transparent 1.2px) 0 0 / 18px 18px,
        var(--canvas);
    }
    .canvas-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 18px 8px;
    }
    .canvas-head h2 { margin: 0; font-size: 13px; font-weight: 700; }
    .canvas-head span { color: var(--muted); font-size: 12px; }
    .health { display: flex; gap: 6px; flex-wrap: wrap; }
    .health i {
      font-style: normal; font-size: 11px; color: #4d6158;
      background: #fff; border: 1px solid #dbe6e1; border-radius: 999px; padding: 3px 8px;
    }

    .paper-scroll {
      flex: 1; min-height: 0; overflow: auto;
      padding: 8px 28px 24px;
    }
    .paper {
      width: min(720px, 100%);
      min-height: calc(100% - 8px);
      margin: 0 auto;
      padding: 28px 36px 40px;
      background: var(--paper);
      border: 1px solid #dce6e0;
      box-shadow: 0 18px 40px rgba(22, 52, 44, .08);
      position: relative;
    }
    .paper.over {
      outline: 2px solid var(--green);
      outline-offset: -2px;
      background: #f7fbf9;
    }
    .paper:before {
      content: "";
      position: absolute; left: 28px; top: 0; bottom: 0; width: 1px;
      background: #f1d4d0;
    }
    .paper-meta { display: flex; gap: 18px; color: #8b9691; font-size: 12px; margin: 0 0 10px 12px; }
    .paper-title {
      width: 100%; border: 0; outline: 0; background: transparent;
      text-align: center; font-size: 22px; font-weight: 750; color: var(--strong);
      font-family: "Songti SC", "Songti TC", "Noto Serif SC", serif;
      margin: 4px 0 6px;
    }
    .paper-sub { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 18px; }

    .empty-paper {
      margin: 40px 12px 0;
      min-height: 280px;
      display: grid; place-items: center; text-align: center;
      border: 1.5px dashed #c9d7d0; border-radius: 12px; color: var(--muted);
    }
    .empty-paper b { display: block; color: var(--strong); font-size: 15px; margin-bottom: 6px; }
    .empty-paper p { margin: 0 0 12px; font-size: 12px; line-height: 1.6; }

    .section-h {
      margin: 18px 0 8px 12px;
      font-size: 14px; font-weight: 750;
    }
    .sq {
      display: grid; grid-template-columns: 28px 1fr; gap: 8px;
      padding: 10px 8px 12px 12px;
      border-radius: 10px;
    }
    .sq:hover { background: #f6f8f7; }
    .sq-num {
      width: 24px; height: 24px; margin-top: 2px;
      border-radius: 50%; display: grid; place-items: center;
      background: var(--soft); color: var(--green); font-size: 12px; font-weight: 800;
    }
    .sq-text {
      font-family: "Songti SC", "Songti TC", "Noto Serif SC", serif;
      font-size: 15px; line-height: 1.7; outline: 0;
    }
    .sq-opts { margin-top: 4px; color: #44584f; font-size: 13px; }
    .sq-tools {
      display: none; gap: 6px; margin-top: 8px; align-items: center;
    }
    .sq:hover .sq-tools, .sq:focus-within .sq-tools { display: flex; }
    .sq-tools button {
      height: 26px; padding: 0 8px; border: 0; border-radius: 6px;
      background: #eef2f0; color: #4d6158; font-size: 11px;
    }
    .sq-tools button:hover { background: var(--soft); color: var(--green); }
    .sq-tools .danger:hover { background: #fdecea; color: var(--danger); }
    .src { margin-left: auto; color: #93a39c; font-size: 11px; }

    .dock {
      flex: none;
      display: flex; align-items: center; gap: 10px;
      margin: 0 18px 14px;
      padding: 8px 10px 8px 14px;
      border: 1px solid #d5e0db; border-radius: 14px;
      background: #fff;
    }
    .dock strong { font-size: 13px; }
    .dock span { color: var(--muted); font-size: 12px; }
    .ai-input {
      flex: 1; height: 36px; display: flex; align-items: center; gap: 8px;
      padding: 0 6px 0 12px;
      border: 1px solid #d5e3dc; border-radius: 10px; background: #f8faf9;
    }
    .ai-input input { flex: 1; border: 0; outline: 0; background: transparent; }
    .ai-send {
      width: 28px; height: 28px; border: 0; border-radius: 8px;
      background: var(--green); color: #fff; display: grid; place-items: center;
    }

    .toast {
      position: fixed; left: 50%; bottom: 24px;
      transform: translate(-50%, 12px);
      opacity: 0; pointer-events: none;
      background: #16342c; color: #fff;
      padding: 10px 16px; border-radius: 10px; font-size: 13px;
      transition: .2s ease;
      z-index: 20;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 1280px) {
      .source-tabs { grid-template-columns: 1.4fr 1fr 1fr 1fr; }
      .source-tab small { display: none; }
      .source-tab { min-height: 40px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app"></div>
  <div class="toast" id="toast"></div>
  <input id="fileInput" type="file" accept=".doc,.docx,.pdf,.png,.jpg,.jpeg" hidden>
<script>
const $ = (s, r = document) => r.querySelector(s)
const svg = (d) => `<svg viewBox="0 0 24 24">${d}</svg>`
const icons = {
  mark: svg('<path d="m12 3 1.2 4L17 8.2l-3.8 1.2L12 13.4l-1.2-4L7 8.2l3.8-1.2L12 3Z"/>'),
  plus: svg('<path d="M12 5v14M5 12h14"/>'),
  check: svg('<path d="m5 12 4.2 4.2L19 7"/>'),
  spark: svg('<path d="m12 3 1.2 4L17 8.2l-3.8 1.2L12 13.4l-1.2-4L7 8.2l3.8-1.2L12 3Z"/>'),
  up: svg('<path d="m7 14 5-5 5 5"/>'),
  search: svg('<circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 4.5 4.5"/>'),
}

const BANK = [
  { id:'b1', type:'选择题', kp:'小数乘法', diff:'基础', score:3, text:'下列算式中，积最大的是（　）。', options:['A. 3.2×0.8','B. 3.2×1.2','C. 0.32×12','D. 32×0.12'] },
  { id:'b2', type:'选择题', kp:'小数乘法', diff:'易错', score:3, text:'一个因数扩大 10 倍，另一个因数缩小 10 倍，积（　）。', options:['A. 扩大 10 倍','B. 缩小 10 倍','C. 不变','D. 无法确定'] },
  { id:'b3', type:'填空题', kp:'小数乘法', diff:'基础', score:3, text:'3.6 × 1.5 ＝ ____。用竖式计算时，积里小数点的位置应与____对齐。' },
  { id:'b4', type:'填空题', kp:'小数除法', diff:'基础', score:3, text:'6.4 ÷ 0.8 ＝ ____，640 ÷ 80 ＝ ____。' },
  { id:'b5', type:'解答题', kp:'多边形面积', diff:'中等', score:6, text:'一块平行四边形草地底 18 米、高 12 米。每平方米需草种 0.6 千克，一共需要多少千克？' },
  { id:'b6', type:'选择题', kp:'简易方程', diff:'基础', score:3, text:'方程 2x＋6＝18 的解是（　）。', options:['A. x＝4','B. x＝6','C. x＝8','D. x＝12'] },
  { id:'b7', type:'填空题', kp:'可能性', diff:'基础', score:2, text:'盒子里有 5 个红球和 1 个蓝球，任意摸一个，摸到____球的可能性更大。' },
  { id:'b8', type:'解答题', kp:'分段计费', diff:'提高', score:8, text:'某快递前 1 千克收费 12 元，超过部分每 0.5 千克收费 4 元。寄 2.8 千克物品需付多少元？' },
  { id:'b9', type:'选择题', kp:'小数除法', diff:'中等', score:3, text:'把 2.4 ÷ 0.6 转化成除数是整数的除法，正确的是（　）。', options:['A. 24 ÷ 6','B. 24 ÷ 0.6','C. 2.4 ÷ 6','D. 0.24 ÷ 6'] },
  { id:'b10', type:'解答题', kp:'小数乘法', diff:'中等', score:6, text:'商店里苹果 8.6 元/千克。买 2.5 千克，付给 50 元，应找回多少元？' },
]

const TREE = [
  ['全部知识点', 10, true],
  ['数与代数', 7, true],
  ['小数乘法', 4, false],
  ['小数除法', 2, false],
  ['简易方程', 1, false],
  ['分段计费', 1, false],
  ['图形与几何', 1, true],
  ['多边形面积', 1, false],
  ['统计与概率', 1, true],
  ['可能性', 1, false],
]

const PARENTS = { '数与代数':['小数乘法','小数除法','简易方程','分段计费'], '图形与几何':['多边形面积'], '统计与概率':['可能性'] }

const KB = [
  { id:'k1', title:'小数乘除法错题集', meta:'收藏题集 · 18 题 · 五年级上册', ids:['b1','b2','b4'] },
  { id:'k2', title:'2025 西城区期末卷', meta:'历史试卷 · 26 题 · 区级题库', ids:['b5','b8','b10'] },
  { id:'k3', title:'长方体互动课件配套练', meta:'校本资源 · 6 道配套题', ids:['b5','b7'] },
  { id:'k4', title:'五年级计算每日练', meta:'我的题单 · 12 题 · 昨天', ids:['b1','b3','b9'] },
]

const state = {
  tab: 'bank',
  kp: '全部知识点',
  type: '全部题型',
  q: '',
  selected: new Set(),
  sheet: [],
  title: '五年级小数乘法练习',
  parsing: false,
  parsed: [],
  dragId: '',
}

const uid = () => 's-' + Math.random().toString(36).slice(2, 8)
const toast = (t) => { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), 2000) }

function matchKp(item) {
  if (state.kp === '全部知识点') return true
  if (item.kp === state.kp) return true
  return PARENTS[state.kp]?.includes(item.kp)
}
function bankList() {
  const q = state.q.trim()
  return BANK.filter((item) => {
    const kp = matchKp(item)
    const type = state.type === '全部题型' || item.type === state.type
    const search = !q || item.text.includes(q) || item.kp.includes(q)
    return kp && type && search
  })
}
function addedIndex(id) {
  const i = state.sheet.findIndex((x) => x.sourceId === id)
  return i >= 0 ? i + 1 : 0
}
function meta() {
  const score = state.sheet.reduce((s, q) => s + q.score, 0)
  const minutes = Math.max(8, Math.round(state.sheet.length * 1.8))
  const types = {}
  const kps = new Set()
  state.sheet.forEach((q) => { types[q.type] = (types[q.type] || 0) + 1; kps.add(q.kp) })
  return { n: state.sheet.length, score, minutes, types, kps }
}
function cloneQ(src, extra = {}) {
  return { ...src, id: uid(), sourceId: src.id, source: extra.source || '平台题库', ...extra }
}
function addFromBank(ids, source = '平台题库') {
  let n = 0
  ids.forEach((id) => {
    if (addedIndex(id)) return
    const src = BANK.find((x) => x.id === id)
    if (!src) return
    state.sheet.push(cloneQ(src, { source }))
    n += 1
  })
  if (n) toast(`已加入题单 ${n} 道`)
  state.selected.clear()
  render()
}
function removeBySource(id) {
  state.sheet = state.sheet.filter((q) => q.sourceId !== id)
  render()
}
function groupedSheet() {
  const order = ['选择题', '填空题', '解答题']
  const groups = []
  order.forEach((type) => {
    const items = state.sheet.filter((q) => q.type === type)
    if (items.length) groups.push({ type, items })
  })
  return groups
}

function tabsMarkup() {
  const tabs = [
    ['bank', 'source-tab source-tab--hero', '主路径 · 1,280 题', '平台题库'],
    ['knowledge', 'source-tab', '按章节规划覆盖', '知识点'],
    ['upload', 'source-tab', '文件转结构化题', 'AI 录题'],
    ['mine', 'source-tab', '校本 / 收藏 / 历史', '我的知识库'],
  ]
  return `<div class="source-tabs" role="tablist">${tabs.map(([id, cls, sub, name]) =>
    `<button class="${cls} ${state.tab === id ? 'on' : ''}" data-tab="${id}"><small>${sub}</small><b>${name}</b></button>`
  ).join('')}</div>`
}

function bankMarkup() {
  const list = bankList()
  return `<div class="bank">
    <aside class="tree">
      <div class="tree-title">人教版 · 五年级上册<span>先点知识点，再挑题</span></div>
      <div class="tree-list">${TREE.map(([name, count, group]) =>
        `<button class="tree-item ${group ? 'group' : ''} ${state.kp === name ? 'on' : ''}" data-kp="${name}"><span>${name}</span><em>${count}</em></button>`
      ).join('')}</div>
    </aside>
    <div class="results">
      <div class="results-head">
        <label class="search">${icons.search}<input id="qSearch" placeholder="搜题干、知识点" value="${state.q}"></label>
        <div class="filters">
          <select id="typeFilter"><option ${state.type==='全部题型'?'selected':''}>全部题型</option><option ${state.type==='选择题'?'selected':''}>选择题</option><option ${state.type==='填空题'?'selected':''}>填空题</option><option ${state.type==='解答题'?'selected':''}>解答题</option></select>
        </div>
        <span class="count">${state.kp} · ${list.length} 道</span>
      </div>
      <div class="q-list">${list.map(qcard).join('') || '<div class="empty-paper"><b>没有符合条件的题</b><p>换一个知识点或题型试试</p></div>'}</div>
      <div class="select-bar">
        <span>已勾选 ${state.selected.size} 道 · 可拖到右侧画布</span>
        <button class="mini primary" data-add-selected ${state.selected.size ? '' : 'disabled'}>加入题单</button>
      </div>
    </div>
  </div>`
}

function qcard(q) {
  const n = addedIndex(q.id)
  const checked = state.selected.has(q.id)
  return `<article class="qcard ${n ? 'in-sheet' : ''}" draggable="true" data-drag="${q.id}">
    <input type="checkbox" data-sel="${q.id}" ${checked ? 'checked' : ''}>
    <div>
      <div class="qcard-tags">
        <span class="tag">${q.type}</span>
        <span class="tag">${q.diff}</span>
        <span class="tag">${q.kp}</span>
        ${n ? `<span class="tag added">已在题单 · 第 ${n} 题</span>` : ''}
      </div>
      <p>${q.text}</p>
      ${q.options ? `<small>${q.options.slice(0,2).join('　')}</small>` : ''}
    </div>
    <div class="qcard-ops">
      <button class="icon-btn ${n ? 'on' : ''}" data-quick="${q.id}" title="${n ? '移出题单' : '加入题单'}">${n ? icons.check : icons.plus}</button>
    </div>
  </article>`
}

function knowledgeMarkup() {
  const covered = new Set(state.sheet.map((q) => q.kp))
  const groups = Object.entries(PARENTS)
  return `<div class="panel"><div class="kp-grid">${groups.map(([parent, children]) => `
    <section class="kp-group">
      <h3>${parent}</h3>
      ${children.map((name) => {
        const count = BANK.filter((q) => q.kp === name).length
        const inSheet = state.sheet.filter((q) => q.kp === name).length
        return `<div class="kp-row">
          <div><b>${name}</b><span>${count} 道飞象题${inSheet ? ` · 题单已有 ${inSheet}` : ''}</span></div>
          <em class="cover ${inSheet ? '' : 'off'}">${inSheet ? '已覆盖' : '未覆盖'}</em>
          <div>
            <button class="mini" data-goto-kp="${name}">看题库</button>
            <button class="mini primary" data-draw-kp="${name}">抽 3 题加入</button>
          </div>
        </div>`
      }).join('')}
    </section>`).join('')}</div></div>`
}

function uploadMarkup() {
  return `<div class="panel">
    <button class="dropzone" type="button" data-pick-file>
      <div>
        <b>把试卷、练习册或照片拖到这里</b>
        <p>支持 Word / PDF / 图片 · AI 拆题后变成可组卷的结构化题目</p>
      </div>
    </button>
    <div class="upload-list">
      <div class="file-row"><span class="file-ico">PDF</span><span><b>五年级上册小数乘法单元练.pdf</b><small>上次识别 12 题 · 可再次录入</small></span><button class="mini primary" data-reparse>重新识别</button></div>
    </div>
    ${state.parsing ? `<div class="parse-card"><h3>正在拆题…</h3><p>识别版式、切分题目、匹配知识点和答案。</p></div>` : ''}
    ${state.parsed.length ? `<div class="parse-card">
      <h3>识别出 ${state.parsed.length} 道题，确认后加入画布</h3>
      ${state.parsed.map((q) => `<p style="margin:8px 0;font-size:13px"><b>${q.type}</b> ${q.text}</p>`).join('')}
      <button class="primary" data-confirm-parse>确认录入并加入题单</button>
    </div>` : ''}
  </div>`
}

function mineMarkup() {
  return `<div class="panel">${KB.map((k) => `
    <button class="kb-row" data-import-kb="${k.id}">
      <span><b>${k.title}</b><small>${k.meta}</small></span>
      <span class="mini primary">导入题单</span>
    </button>`).join('')}</div>`
}

function paperMarkup() {
  const m = meta()
  if (!state.sheet.length) {
    return `<div class="empty-paper">
      <div>
        <b>空白题单画布</b>
        <p>从左侧平台题库点「＋」或把题目拖到这张纸上。<br>上传试卷、知识库导入也会落到这里。</p>
        <button class="mini primary" data-tab="bank">去平台题库选题</button>
      </div>
    </div>`
  }
  let n = 0
  const labels = { 选择题:'一、选择题', 填空题:'二、填空题', 解答题:'三、解答题' }
  return groupedSheet().map((g) => `
    <h3 class="section-h">${labels[g.type]}（每题 ${g.items[0].score} 分）</h3>
    ${g.items.map((q) => {
      n += 1
      return `<article class="sq" data-sid="${q.id}">
        <span class="sq-num">${n}</span>
        <div>
          <div class="sq-text" contenteditable="true">${q.text}</div>
          ${q.options ? `<div class="sq-opts">${q.options.join('　　')}</div>` : ''}
          <div class="sq-tools">
            <button data-move="${q.id}" data-dir="-1">上移</button>
            <button data-move="${q.id}" data-dir="1">下移</button>
            <button data-adapt="${q.id}">AI 改编</button>
            <button class="danger" data-del="${q.id}">删除</button>
            <span class="src">${q.source} · ${q.kp} · ${q.score} 分</span>
          </div>
        </div>
      </article>`
    }).join('')}
  `).join('')
}

function render() {
  const m = meta()
  const typeText = Object.entries(m.types).map(([k,v]) => k.replace('题','') + v).join(' / ') || '尚未选题'
  $('#app').innerHTML = `
    <header class="topbar">
      <div class="brand"><span class="logo">${icons.mark}</span>飞象组题</div>
      <input class="title-edit" id="sheetTitle" value="${state.title}">
      <div class="meta"><b>五年级 · 数学</b><span class="dot"></span><span>人教版</span><span class="dot"></span><span>工作台首页</span></div>
      <span class="spacer"></span>
      <button class="ghost" data-preview>预览</button>
      <button class="ghost" data-download>下载</button>
      <button class="primary" data-send>发给学生</button>
    </header>
    <div class="workspace">
      <section class="picker">
        <div class="picker-head">
          <div><h1>加题</h1><p>平台题库是主路径，其余三个入口只在需要时切换</p></div>
          <select class="subject-select"><option>五年级 · 数学</option><option>五年级 · 语文</option><option>七年级 · 数学</option></select>
        </div>
        ${tabsMarkup()}
        <div class="picker-body">
          ${state.tab === 'bank' ? bankMarkup() : state.tab === 'knowledge' ? knowledgeMarkup() : state.tab === 'upload' ? uploadMarkup() : mineMarkup()}
        </div>
      </section>
      <section class="canvas">
        <div class="canvas-head">
          <div><h2>组题单画布</h2><span>题目落到这张纸上，可改、可排、可发给学生</span></div>
          <div class="health"><i>${m.n} 题</i><i>${m.score || 0} 分</i><i>约 ${m.n ? m.minutes : '--'} 分钟</i><i>${typeText}</i><i>知识点 ${m.kps.size}</i></div>
        </div>
        <div class="paper-scroll">
          <div class="paper" id="paper">
            <div class="paper-meta"><span>学校：____________</span><span>班级：________</span><span>姓名：________</span></div>
            <input class="paper-title" value="${state.title}">
            <div class="paper-sub">五年级 · 数学　·　共 ${m.n} 题　·　满分 ${m.score || '--'} 分</div>
            ${paperMarkup()}
          </div>
        </div>
        <div class="dock">
          <div><strong>${m.n} 题 · ${m.score || 0} 分</strong><div><span>建议 ${m.n ? m.minutes : 0} 分钟完成</span></div></div>
          <label class="ai-input">${icons.spark}<input id="aiPrompt" placeholder="${m.n ? '再补 2 道小数乘法易错题' : '直接说：五年级小数乘法 8 题，基础为主'}"><button class="ai-send" data-ai-send>${icons.up}</button></label>
        </div>
      </section>
    </div>`
  bind()
}

function bind() {
  document.querySelectorAll('[data-tab]').forEach((el) => el.onclick = () => { state.tab = el.dataset.tab; render() })
  document.querySelectorAll('[data-kp]').forEach((el) => el.onclick = () => { state.kp = el.dataset.kp; render() })
  const search = $('#qSearch')
  if (search) search.oninput = (e) => { state.q = e.target.value; renderKeepFocus('qSearch') }
  const type = $('#typeFilter')
  if (type) type.onchange = (e) => { state.type = e.target.value; render() }
  document.querySelectorAll('[data-sel]').forEach((el) => el.onchange = () => {
    if (el.checked) state.selected.add(el.dataset.sel); else state.selected.delete(el.dataset.sel)
    render()
  })
  document.querySelectorAll('[data-quick]').forEach((el) => el.onclick = () => {
    const id = el.dataset.quick
    if (addedIndex(id)) { removeBySource(id); toast('已从题单移除'); return }
    addFromBank([id])
  })
  $('[data-add-selected]')?.addEventListener('click', () => addFromBank([...state.selected]))
  document.querySelectorAll('[data-goto-kp]').forEach((el) => el.onclick = () => { state.kp = el.dataset.gotoKp; state.tab = 'bank'; render() })
  document.querySelectorAll('[data-draw-kp]').forEach((el) => el.onclick = () => {
    const ids = BANK.filter((q) => q.kp === el.dataset.drawKp).slice(0, 3).map((q) => q.id)
    addFromBank(ids)
  })
  $('[data-pick-file]')?.addEventListener('click', () => $('#fileInput').click())
  $('[data-reparse]')?.addEventListener('click', simulateParse)
  $('[data-confirm-parse]')?.addEventListener('click', () => {
    state.parsed.forEach((q) => state.sheet.push(cloneQ(q, { source: 'AI录题' })))
    toast(`已录入 ${state.parsed.length} 道题`)
    state.parsed = []
    render()
  })
  document.querySelectorAll('[data-import-kb]').forEach((el) => el.onclick = () => {
    const pack = KB.find((k) => k.id === el.dataset.importKb)
    addFromBank(pack.ids, '我的知识库')
  })
  document.querySelectorAll('[data-del]').forEach((el) => el.onclick = () => {
    state.sheet = state.sheet.filter((q) => q.id !== el.dataset.del)
    render()
  })
  document.querySelectorAll('[data-move]').forEach((el) => el.onclick = () => {
    const i = state.sheet.findIndex((q) => q.id === el.dataset.move)
    const j = i + Number(el.dataset.dir)
    if (i < 0 || j < 0 || j >= state.sheet.length) return
    const [item] = state.sheet.splice(i, 1)
    state.sheet.splice(j, 0, item)
    render()
  })
  document.querySelectorAll('[data-adapt]').forEach((el) => el.onclick = () => {
    const q = state.sheet.find((x) => x.id === el.dataset.adapt)
    if (!q) return
    q.text = q.text.replace('（　）', '（生活情境）（　）')
    if (!q.text.includes('生活情境') && !q.text.includes('商店')) q.text = '结合生活情境：' + q.text
    q.source = 'AI 改编'
    toast('已生成一版改编，可继续改题干')
    render()
  })
  $('#sheetTitle')?.addEventListener('change', (e) => { state.title = e.target.value; render() })
  $('.paper-title')?.addEventListener('change', (e) => { state.title = e.target.value; render() })
  $('[data-ai-send]')?.addEventListener('click', runAi)
  $('#aiPrompt')?.addEventListener('keydown', (e) => { if (e.key === 'Enter') runAi() })
  $('[data-send]')?.addEventListener('click', () => toast(state.sheet.length ? '已生成学生作答链接（演示）' : '先往画布里加几道题'))
  $('[data-download]')?.addEventListener('click', () => toast('演示：导出 Word / PDF'))
  $('[data-preview]')?.addEventListener('click', () => toast('演示：打开学生端预览'))

  document.querySelectorAll('[data-drag]').forEach((el) => {
    el.addEventListener('dragstart', (e) => {
      state.dragId = el.dataset.drag
      el.classList.add('dragging')
      e.dataTransfer.setData('text/plain', state.dragId)
    })
    el.addEventListener('dragend', () => el.classList.remove('dragging'))
  })
  const paper = $('#paper')
  paper.addEventListener('dragover', (e) => { e.preventDefault(); paper.classList.add('over') })
  paper.addEventListener('dragleave', () => paper.classList.remove('over'))
  paper.addEventListener('drop', (e) => {
    e.preventDefault()
    paper.classList.remove('over')
    const id = e.dataTransfer.getData('text/plain') || state.dragId
    if (id) addFromBank([id])
  })
}

function renderKeepFocus(id) {
  const el = document.getElementById(id)
  const pos = el?.selectionStart
  render()
  const next = document.getElementById(id)
  if (next) { next.focus(); if (pos != null) next.setSelectionRange(pos, pos) }
}

function simulateParse() {
  state.parsing = true
  state.parsed = []
  render()
  setTimeout(() => {
    state.parsing = false
    state.parsed = [
      { id:'u1', type:'选择题', kp:'小数乘法', diff:'基础', score:3, text:'0.5 × 0.4 的积是（　）。', options:['A. 0.02','B. 0.2','C. 2','D. 20'] },
      { id:'u2', type:'填空题', kp:'小数乘法', diff:'中等', score:3, text:'一个长方形长 3.5 米，宽 2.4 米，面积是____平方米。' },
      { id:'u3', type:'解答题', kp:'小数乘法', diff:'中等', score:6, text:'牛奶 12.8 元/盒，买 3 盒应付多少元？' },
    ]
    state.tab = 'upload'
    toast('已识别 3 道题，待确认录入')
    render()
  }, 900)
}

function runAi() {
  const text = $('#aiPrompt')?.value.trim() || '再补 2 道小数乘法易错题'
  const pool = BANK.filter((q) => !addedIndex(q.id)).slice(0, 2)
  if (!pool.length) { toast('题库里能补的题已经用完'); return }
  pool.forEach((q) => state.sheet.push(cloneQ(q, { source: 'AI 补题' })))
  toast(`已按「${text}」补了 ${pool.length} 道题`)
  render()
}

$('#fileInput').addEventListener('change', simulateParse)
render()
</script>
</body>
</html>
